name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Copier le jeu dans le projet Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../La-Veillee-1.0.${{ github.run_number }}.apk"

      - name: Garder l'APK dans le build
        uses: actions/upload-artifact@v4
        with:
          name: La-Veillee-1.0.${{ github.run_number }}
          path: La-Veillee-*.apk

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: La Veillée 1.0.${{ github.run_number }}
          body: APK Android de La Veillée, construit automatiquement depuis le commit ${{ github.sha }}.
          files: La-Veillee-*.apk
          make_latest: true
